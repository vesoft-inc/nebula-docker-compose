      - --v=0
      - --minloglevel=0
    depends_on:
      data-init:
        condition: service_completed_successfully
      storaged0:
        condition: service_started
      storaged1:
        condition: service_started
      storaged2:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://graphd:19669/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    ports:
      - "9669:9669"
      - 19669
      - 19670
    volumes:
      - ./logs/graph:/logs
    networks:
