version: '3.4'
services:
  data-init:
    # Docker creates missing bind-mount source directories as root. Initialize
    # only the top-level directories; Nebula creates its own child files.
    image: docker.io/vesoft/nebula-metad:nightly
    user: root
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mkdir -p /data/meta0 /data/meta1 /data/meta2 /data/storage0 /data/storage1 /data/storage2
        mkdir -p /logs/meta0 /logs/meta1 /logs/meta2 /logs/storage0 /logs/storage1 /logs/storage2 /logs/graph /logs/graph1 /logs/graph2
        chown 10001:10001 /data/meta0 /data/meta1 /data/meta2 /data/storage0 /data/storage1 /data/storage2
        chown 10001:10001 /logs/meta0 /logs/meta1 /logs/meta2 /logs/storage0 /logs/storage1 /logs/storage2 /logs/graph /logs/graph1 /logs/graph2
        echo "Data and log directory permissions initialized:"
        ls -ldh /data/meta0 /data/meta1 /data/meta2 /data/storage0 /data/storage1 /data/storage2
        ls -ldh /logs/meta0 /logs/meta1 /logs/meta2 /logs/storage0 /logs/storage1 /logs/storage2 /logs/graph /logs/graph1 /logs/graph2
    volumes:
      - ./data:/data/
      - ./logs:/logs/
    restart: "no"

  metad0:
    image: docker.io/vesoft/nebula-metad:nightly
    user: "10001:10001"
    environment:
      TZ:   "${TZ}"
    depends_on:
      data-init:
        condition: service_completed_successfully
    command:
      - --meta_server_addrs=metad0:9559,metad1:9559,metad2:9559
      - --local_ip=metad0
      - --ws_ip=metad0
      - --port=9559
      - --ws_http_port=19559
      - --data_path=/data/meta
      - --log_dir=/logs
      - --v=0
      - --minloglevel=0
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://metad0:19559/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    ports:
      - 9559
      - 19559
      - 19560
    volumes:
      - ./data/meta0:/data/meta
      - ./logs/meta0:/logs
    networks:
      - nebula-net
    restart: on-failure
    cap_add:
      - SYS_PTRACE

  metad1:
    image: docker.io/vesoft/nebula-metad:nightly
    user: "10001:10001"
    environment:
      TZ:   "${TZ}"
    depends_on:
      data-init:
        condition: service_completed_successfully
    command:
      - --meta_server_addrs=metad0:9559,metad1:9559,metad2:9559
      - --local_ip=metad1
      - --ws_ip=metad1
      - --port=9559
      - --ws_http_port=19559
      - --data_path=/data/meta
      - --log_dir=/logs
      - --v=0
      - --minloglevel=0
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://metad1:19559/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    ports:
      - 9559
      - 19559
      - 19560
    volumes:
      - ./data/meta1:/data/meta
      - ./logs/meta1:/logs
    networks:
      - nebula-net
    restart: on-failure
    cap_add:
      - SYS_PTRACE

  metad2:
    image: docker.io/vesoft/nebula-metad:nightly
    user: "10001:10001"
    environment:
      TZ:   "${TZ}"
    depends_on:
      data-init:
        condition: service_completed_successfully
    command:
      - --meta_server_addrs=metad0:9559,metad1:9559,metad2:9559
      - --local_ip=metad2
      - --ws_ip=metad2
      - --port=9559
      - --ws_http_port=19559
      - --data_path=/data/meta
      - --log_dir=/logs
      - --v=0
      - --minloglevel=0
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://metad2:19559/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    ports:
      - 9559
      - 19559
      - 19560
    volumes:
      - ./data/meta2:/data/meta
      - ./logs/meta2:/logs
    networks:
      - nebula-net
    restart: on-failure
